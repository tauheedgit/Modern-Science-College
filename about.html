<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About Us — Modern Science School, Jogapur Pratapgarh</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f5f6fa; color: #2d3436; line-height: 1.7;
    }
    a { text-decoration: none; color: inherit; }

    /* NAVBAR */
    nav {
      position: sticky; top: 0; z-index: 999;
      background: #0d1b2a;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .logo {
      display: flex; align-items: center; gap: 12px;
      color: #fff; font-size: 1.05rem; font-weight: 600;
    }
    .logo-circle {
      width: 42px; height: 42px; border-radius: 50%;
      background: linear-gradient(135deg, #1e90ff, #00b894);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; font-weight: bold; color: #fff; flex-shrink: 0;
    }
    .nav-links { display: flex; gap: 6px; list-style: none; }
    .nav-links a {
      display: block; padding: 10px 18px;
      color: #dfe6e9; font-size: 0.9rem; font-weight: 500;
      border-radius: 6px; transition: all 0.2s;
    }
    .nav-links a:hover, .nav-links a.active {
      background: #1e90ff; color: #fff;
    }

    /* Hamburger */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      background: none;
      border: none;
      padding: 6px;
      z-index: 1000;
    }
    .hamburger span {
      display: block;
      width: 26px;
      height: 3px;
      background: #dfe6e9;
      border-radius: 3px;
      transition: all 0.3s;
    }
    .hamburger.open span:nth-child(1) { transform: rotate(45deg) translate(5px, 6px); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translate(5px, -6px); }

    /* PAGE HEADER */
    .page-header {
      background: linear-gradient(135deg, rgba(13,27,42,0.85), rgba(30,144,255,0.65)),
                  url('../img/collegepic1.jpeg') center/cover no-repeat;
      color: #fff; text-align: center;
      padding: 100px 24px 80px;
    }
    .page-header h1 { font-size: 2.8rem; font-weight: 800; margin-bottom: 12px; }
    .page-header p { font-size: 1.1rem; opacity: 0.9; max-width: 650px; margin: 0 auto; }
    .breadcrumb { font-size: 0.88rem; opacity: 0.7; margin-bottom: 12px; }
    .breadcrumb a { color: #fff; text-decoration: underline; }

    /* SECTIONS */
    section { padding: 72px 40px; max-width: 1100px; margin: 0 auto; }
    .section-title { text-align: center; margin-bottom: 48px; }
    .section-title h2 {
      font-size: 2rem; color: #0d1b2a;
      display: inline-block; position: relative;
    }
    .section-title h2::after {
      content: ''; display: block; width: 55px; height: 4px;
      background: #1e90ff; border-radius: 2px; margin: 10px auto 0;
    }
    .section-title p { color: #636e72; margin-top: 10px; }

    /* ABOUT BLOCK */
    #about-intro { background: #fff; padding: 72px 40px; }
    #about-intro .section-title { max-width: 1100px; margin: 0 auto 48px; }
    .about-content {
      display: grid; grid-template-columns: 1fr 1fr; gap: 50px;
      max-width: 1100px; margin: 0 auto; align-items: center;
    }
    .about-content img {
      width: 100%; border-radius: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.12);
    }
    .about-text p { color: #636e72; margin-bottom: 14px; font-size: 0.98rem; }

    /* MISSION VISION */
    #mission-vision { background: #f5f6fa; }
    .mv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; max-width: 1100px; margin: 0 auto; }
    .mv-card {
      background: #fff; border-radius: 14px; padding: 36px 30px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
      border-left: 5px solid #1e90ff;
    }
    .mv-card.vision { border-left-color: #00b894; }
    .mv-card h3 { color: #0d1b2a; font-size: 1.2rem; margin-bottom: 14px; }
    .mv-card p { color: #636e72; font-size: 0.95rem; }
    .mv-icon { font-size: 2rem; margin-bottom: 14px; }

    /* VALUES */
    #values { background: #fff; }
    .values-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 24px; max-width: 1100px; margin: 0 auto;
    }
    .value-card {
      text-align: center; padding: 28px 20px;
      border-radius: 12px;
      background: #f5f6fa;
      transition: transform 0.2s, background 0.2s;
    }
    .value-card:hover { background: #e8f4fd; transform: translateY(-4px); }
    .value-icon { font-size: 2.2rem; margin-bottom: 12px; }
    .value-card h3 { color: #0d1b2a; font-size: 1rem; margin-bottom: 8px; }
    .value-card p { color: #636e72; font-size: 0.87rem; }

    /* HISTORY TIMELINE */
    #history { background: #f5f6fa; }
    .timeline { max-width: 800px; margin: 0 auto; }
    .timeline-item {
      display: flex; gap: 24px; margin-bottom: 32px;
      position: relative;
    }
    .timeline-year {
      min-width: 90px; font-weight: 800; font-size: 1.1rem;
      color: #1e90ff; padding-top: 4px;
    }
    .timeline-dot {
      width: 14px; height: 14px; border-radius: 50%;
      background: #1e90ff; margin-top: 8px; flex-shrink: 0;
    }
    .timeline-body { background: #fff; border-radius: 10px; padding: 18px 22px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); flex: 1; }
    .timeline-body h4 { color: #0d1b2a; margin-bottom: 6px; font-size: 0.95rem; }
    .timeline-body p { color: #636e72; font-size: 0.88rem; }

    /* LEADERSHIP */
    #leadership { background: #fff; }
    .leader-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 30px; max-width: 900px; margin: 0 auto; }
    .leader-card { text-align: center; }
    .leader-avatar {
      width: 100px; height: 100px; border-radius: 50%;
      background: linear-gradient(135deg, #1e90ff, #00b894);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.5rem; color: #fff; margin: 0 auto 14px;
    }
    .leader-card h3 { color: #0d1b2a; font-size: 1rem; }
    .leader-card .role { color: #1e90ff; font-size: 0.88rem; font-weight: 600; }
    .leader-card .desc { color: #636e72; font-size: 0.85rem; margin-top: 6px; }

    /* FOOTER */
    footer {
      background: #0d1b2a; color: #b2bec3;
      padding: 50px 40px 24px;
    }
    .footer-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 40px; max-width: 1100px; margin: 0 auto 40px;
    }
    .footer-col h3 { color: #fff; margin-bottom: 16px; font-size: 1rem; }
    .footer-col p, .footer-col a { color: #b2bec3; font-size: 0.9rem; line-height: 2; display: block; }
    .footer-col a:hover { color: #1e90ff; }
    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,0.08);
      text-align: center; padding-top: 20px;
      font-size: 0.85rem; color: #636e72;
    }

    @media (max-width: 768px) {
      nav { padding: 12px 20px; position: relative; }
      .hamburger { display: flex; }
      .nav-links {
        display: none;
        flex-direction: column;
        width: 100%;
        gap: 2px;
        background: #0d1b2a;
        position: absolute;
        top: 100%;
        left: 0;
        padding: 8px 16px 12px;
        border-top: 1px solid #1a2d45;
      }
      .nav-links.open { display: flex; }
      .nav-links a { border-radius: 6px; padding: 12px 14px; }
      .page-header h1 { font-size: 2rem; }
      section { padding: 50px 20px; }
      #about-intro { padding: 50px 20px; }
      .about-content { grid-template-columns: 1fr; gap: 30px; }
      .mv-grid { grid-template-columns: 1fr; }
    }

  /* ─── LOADER OVERLAY ─── */
  #loader-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0a1628 0%, #050d1a 70%, #020810 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 99999;
    transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }
  #loader-overlay.hidden {
    opacity: 0;
    visibility: hidden;
  }
  .loader-wrapper {
    position: relative;
    width: 260px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .loader-ring-outer {
    position: absolute;
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 2px solid rgba(30, 144, 255, 0.15);
    box-shadow: 0 0 30px rgba(30, 144, 255, 0.08),
                inset 0 0 30px rgba(30, 144, 255, 0.05);
  }
  .loader-ring {
    position: absolute;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: 2.5px solid transparent;
    border-top-color: #1e90ff;
    border-right-color: rgba(0, 184, 148, 0.6);
    animation: ring-spin 2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    filter: drop-shadow(0 0 8px rgba(30, 144, 255, 0.5));
  }
  .loader-ring-inner {
    position: absolute;
    width: 170px;
    height: 170px;
    border-radius: 50%;
    border: 1.5px solid transparent;
    border-bottom-color: rgba(0, 184, 148, 0.4);
    border-left-color: rgba(30, 144, 255, 0.3);
    animation: ring-spin 3s cubic-bezier(0.5, 0, 0.5, 1) infinite reverse;
    filter: drop-shadow(0 0 6px rgba(0, 184, 148, 0.3));
  }
  .loader-ring-dot {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #1e90ff;
    box-shadow: 0 0 12px #1e90ff, 0 0 24px rgba(30, 144, 255, 0.4);
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
  }
  .loader-center {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .loader-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1e90ff, #00b894);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: #fff;
    margin-bottom: 14px;
    box-shadow: 0 0 40px rgba(30, 144, 255, 0.35),
                0 0 80px rgba(0, 184, 148, 0.15);
    animation: icon-pulse 2s ease-in-out infinite;
  }
  .loader-college-name {
    color: #ffffff;
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(30, 144, 255, 0.5);
    white-space: nowrap;
  }
  .loader-college-sub {
    color: #74b9ff;
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 4px;
    opacity: 0.8;
  }
  .bird-orbit-container {
    position: absolute;
    width: 260px;
    height: 260px;
    top: 0;
    left: 0;
    animation: none;
  }
  .bird {
    position: absolute;
    width: 22px;
    height: 22px;
    top: 50%;
    left: 50%;
    margin-top: -11px;
    margin-left: -11px;
    animation: bird-orbit 2.2s linear infinite;
  }
  .bird svg {
    width: 22px;
    height: 22px;
    filter: drop-shadow(0 0 6px #fff) drop-shadow(0 0 12px rgba(30, 144, 255, 0.7));
    animation: wing-flap 0.35s ease-in-out infinite alternate;
  }
  #trail-canvas {
    position: absolute;
    top: -60px;
    left: -60px;
    width: 380px;
    height: 380px;
    pointer-events: none;
    z-index: 1;
  }
  #particle-canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 10;
  }
  .loader-tagline {
    margin-top: 36px;
    color: #636e72;
    font-size: 0.78rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: tagline-pulse 2s ease-in-out infinite;
  }
  .loader-progress-wrap {
    margin-top: 20px;
    width: 160px;
    height: 2px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #1e90ff, #00b894);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(30, 144, 255, 0.5);
    transition: width 0.1s linear;
  }
  @keyframes ring-spin { to { transform: rotate(360deg); } }
  @keyframes icon-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
  @keyframes wing-flap { 0% { transform: scaleY(1) rotate(0deg); } 100% { transform: scaleY(0.7) rotate(-5deg); } }
  @keyframes tagline-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
  @keyframes bird-fly-away {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    30% { transform: translate(0, -80px) rotate(-5deg); opacity: 1; }
    70% { opacity: 0.7; }
    100% { transform: translate(0, -260px) rotate(-15deg); opacity: 0; }
  }
  @keyframes loader-exit {
    0% { transform: scale(1); opacity: 1; filter: blur(0px); }
    100% { transform: scale(0.6); opacity: 0; filter: blur(12px); }
  }
  @keyframes fade-out-all { to { opacity: 0; } }
  @keyframes dot-twinkle { 0%, 100% { opacity: 0.3; transform: scale(0.8); } 50% { opacity: 1; transform: scale(1.2); } }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    border-radius: 50%;
    animation: dot-twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0.3;
  }
  @media (max-width: 480px) {
    .loader-wrapper { width: 200px; height: 200px; }
    .loader-ring-outer { width: 170px; height: 170px; }
    .loader-ring { width: 155px; height: 155px; }
    .loader-ring-inner { width: 130px; height: 130px; }
    .loader-college-name { font-size: 0.85rem; letter-spacing: 1px; }
    .loader-college-sub { font-size: 0.65rem; }
    .loader-icon { width: 50px; height: 50px; font-size: 1.4rem; }
    #trail-canvas { top: -40px; left: -40px; width: 280px; height: 280px; }
    .bird-orbit-container { width: 200px; height: 200px; }
  }
</head>

  <!-- LOADER ANIMATION ENGINE -->
  <script>
  (function () {
    'use strict';

    var TOTAL_DURATION = 3000;
    var BIRD_ORBIT_RADIUS = 125;
    var BIRD_ORBIT_SPEED = 2200;
    var CENTER_X = 190;
    var CENTER_Y = 190;

    var birdOrbit = document.getElementById('bird-orbit');
    var bird = document.getElementById('bird');
    var progressBar = document.getElementById('progress-bar');
    var loaderWrapper = document.getElementById('loader-wrapper');
    var loaderCenter = document.getElementById('loader-center');
    var loaderTagline = document.getElementById('loader-tagline');
    var overlay = document.getElementById('loader-overlay');

    var trailCanvas = document.getElementById('trail-canvas');
    var trailCtx = trailCanvas.getContext('2d');
    var particleCanvas = document.getElementById('particle-canvas');
    var particleCtx = particleCanvas.getContext('2d');

    var startTime = Date.now();
    var animating = true;
    var birdAngle = 0;
    var trail = [];
    var particles = [];
    var orbitDots = [];
    var NUM_ORBIT_DOTS = 8;

    for (var d = 0; d < NUM_ORBIT_DOTS; d++) {
      orbitDots.push({
        angle: (Math.PI * 2 / NUM_ORBIT_DOTS) * d,
        speed: 0.004 + Math.random() * 0.003,
        radius: BIRD_ORBIT_RADIUS + (Math.random() - 0.5) * 20,
        size: Math.random() * 2 + 1,
        opacity: Math.random() * 0.4 + 0.2
      });
    }

    function resizeCanvases() {
      particleCanvas.width = window.innerWidth;
      particleCanvas.height = window.innerHeight;
    }
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);

    function addTrailParticle(x, y) {
      trail.push({ x: x, y: y, radius: Math.random() * 3 + 1.5, opacity: 0.8, decay: Math.random() * 0.015 + 0.01 });
      if (trail.length > 60) trail.shift();
    }

    function drawTrail() {
      trailCtx.clearRect(0, 0, 380, 380);
      for (var i = trail.length - 1; i >= 0; i--) {
        var p = trail[i];
        p.opacity -= p.decay;
        p.radius *= 0.97;
        if (p.opacity <= 0) { trail.splice(i, 1); continue; }
        var g = trailCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
        g.addColorStop(0, 'rgba(30, 144, 255, ' + (p.opacity * 0.9) + ')');
        g.addColorStop(0.4, 'rgba(0, 184, 148, ' + (p.opacity * 0.5) + ')');
        g.addColorStop(1, 'rgba(116, 185, 255, 0)');
        trailCtx.beginPath();
        trailCtx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
        trailCtx.fillStyle = g;
        trailCtx.fill();
      }
    }

    function spawnBurstParticles(cx, cy, count) {
      for (var i = 0; i < count; i++) {
        var angle = Math.random() * Math.PI * 2;
        var speed = Math.random() * 4 + 1.5;
        particles.push({
          x: cx + (Math.random() - 0.5) * 60, y: cy + (Math.random() - 0.5) * 60,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 1.5,
          radius: Math.random() * 3 + 1, opacity: 1,
          decay: Math.random() * 0.012 + 0.006, gravity: 0.02 + Math.random() * 0.03,
          white: Math.random() > 0.3
        });
      }
    }

    function spawnFlyingUpParticles(cx, cy, count) {
      for (var i = 0; i < count; i++) {
        var angle = -Math.PI / 2 + (Math.random() - 0.5) * 1.2;
        var speed = Math.random() * 3 + 1;
        particles.push({
          x: cx + (Math.random() - 0.5) * 40, y: cy,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
          radius: Math.random() * 2.5 + 0.8, opacity: 1,
          decay: Math.random() * 0.01 + 0.005, gravity: -0.01, white: true
        });
      }
    }

    function updateParticles() {
      particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
      for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= 0.99; p.opacity -= p.decay;
        if (p.opacity <= 0) { particles.splice(i, 1); continue; }
        var r = p.radius;
        var g = particleCtx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.5);
        if (p.white) {
          g.addColorStop(0, 'rgba(255, 255, 255, ' + p.opacity + ')');
          g.addColorStop(0.5, 'rgba(200, 230, 255, ' + (p.opacity * 0.5) + ')');
          g.addColorStop(1, 'rgba(255, 255, 255, 0)');
        } else {
          g.addColorStop(0, 'rgba(30, 144, 255, ' + p.opacity + ')');
          g.addColorStop(0.5, 'rgba(0, 184, 148, ' + (p.opacity * 0.4) + ')');
          g.addColorStop(1, 'rgba(30, 144, 255, 0)');
        }
        particleCtx.beginPath();
        particleCtx.arc(p.x, p.y, r * 2.5, 0, Math.PI * 2);
        particleCtx.fillStyle = g;
        particleCtx.fill();
      }
    }

    var exitStarted = false;
    var exitStartTime = 0;

    function animate() {
      if (!animating) return;
      var elapsed = Date.now() - startTime;
      var progress = Math.min(elapsed / TOTAL_DURATION, 1);

      progressBar.style.width = (progress * 100) + '%';

      if (progress < 0.9) {
        birdAngle += (16 / BIRD_ORBIT_SPEED) * Math.PI * 2;
        var bx = Math.cos(birdAngle) * BIRD_ORBIT_RADIUS;
        var by = Math.sin(birdAngle) * BIRD_ORBIT_RADIUS;
        bird.style.transform = 'translate(' + bx + 'px, ' + by + 'px) rotate(' + (birdAngle + Math.PI / 2) + 'rad)';
        bird.style.opacity = '1';
        addTrailParticle(CENTER_X + bx, CENTER_Y + by);
      }

      drawTrail();

      for (var d = 0; d < orbitDots.length; d++) {
        orbitDots[d].angle += orbitDots[d].speed;
        var odx = CENTER_X + Math.cos(orbitDots[d].angle) * orbitDots[d].radius;
        var ody = CENTER_Y + Math.sin(orbitDots[d].angle) * orbitDots[d].radius;
        trailCtx.beginPath();
        trailCtx.arc(odx, ody, orbitDots[d].size, 0, Math.PI * 2);
        trailCtx.fillStyle = 'rgba(30, 144, 255, ' + orbitDots[d].opacity + ')';
        trailCtx.fill();
      }

      updateParticles();

      if (progress >= 1 && !exitStarted) {
        exitStarted = true;
        exitStartTime = Date.now();
        birdOrbit.style.transition = 'opacity 0.3s';
        birdOrbit.style.opacity = '0';
        var rect = bird.getBoundingClientRect();
        spawnFlyingUpParticles(rect.left + rect.width / 2, rect.top + rect.height / 2, 40);
        spawnBurstParticles(CENTER_X, CENTER_Y, 60);
        bird.style.transition = 'all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        bird.style.transform = 'translate(0px, -200px) rotate(-20deg)';
        bird.style.opacity = '0';
      }

      if (exitStarted) {
        var exitProgress = (Date.now() - exitStartTime) / 1200;
        if (exitProgress < 1) {
          var eased = 1 - Math.pow(1 - exitProgress, 3);
          loaderWrapper.style.transition = 'none';
          loaderWrapper.style.transform = 'scale(' + (1 - eased * 0.4) + ')';
          loaderWrapper.style.opacity = 1 - eased;
          loaderWrapper.style.filter = 'blur(' + (eased * 12) + 'px)';
        } else {
          loaderWrapper.style.opacity = '0';
          loaderWrapper.style.transform = 'scale(0.6)';
          loaderWrapper.style.filter = 'blur(12px)';
        }
        if (loaderTagline) loaderTagline.style.opacity = Math.max(0, 1 - exitProgress * 2);
      }

      if (exitStarted && (Date.now() - exitStartTime) > 1500) {
        finishLoading();
        return;
      }
      requestAnimationFrame(animate);
    }

    function finishLoading() {
      animating = false;
      particleCtx.clearRect(0, 0, particleCanvas.width, particleCanvas.height);
      overlay.classList.add('hidden');
      setTimeout(function () { overlay.style.display = 'none'; }, 800);
    }

    requestAnimationFrame(animate);
  })();
  </script>
